baseURL = 'https://matthiaswessling.github.io'
languageCode = 'en-us'
title = 'Matthias Wessling'
theme = 'custom'

disableKinds = ['sitemap']

[params]
  author = 'Matthias Wessling'
  description = 'Information on my work and interests'
  profileImage = '/images/Profile MaWe.jpg'
  github = 'https://github.com/MatthiasWessling'
  linkedin = 'https://www.linkedin.com/in/matthiaswessling/'
  googlescholar = 'https://scholar.google.com/citations?hl=de&user=ldEjzsgAAAAJ&view_op=list_works&sortby=pubdate'
 

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Keep script caches / RIS / CSV out of Hugo's data loader (unknown formats fail Hugo ≥0.153).
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
    files = ["**.json"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = 'Home'
  url = '/'
  weight = 1

