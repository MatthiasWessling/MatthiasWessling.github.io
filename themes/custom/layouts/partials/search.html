<div id="site-search" class="site-search" data-index-url="{{ "index.json" | relURL }}" hidden>
    <div class="site-search-backdrop" data-search-close></div>
    <div class="site-search-dialog" role="dialog" aria-modal="true" aria-labelledby="site-search-title">
        <div class="site-search-header">
            <label class="site-search-label" for="site-search-input" id="site-search-title">Search</label>
            <div class="site-search-input-wrap">
                <svg class="site-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-3.5-3.5" stroke-linecap="round"></path>
                </svg>
                <input
                    type="search"
                    id="site-search-input"
                    class="site-search-input"
                    placeholder='Try: membrane electrodialysis  or  "ion concentration"'
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="search"
                >
                <kbd class="site-search-kbd" data-search-close title="Close">esc</kbd>
            </div>
        </div>
        <div id="site-search-status" class="site-search-status" role="status" aria-live="polite"></div>
        <ul id="site-search-results" class="site-search-results" role="listbox" aria-label="Search results"></ul>
    </div>
</div>
